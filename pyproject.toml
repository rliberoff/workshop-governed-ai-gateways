[project]
name = "governed-ai-gateways-workshop"
version = "1.0.0"
description = "Lab scripts for the workshop 'From models to governed AI: AI gateways with Azure API Management, Microsoft Foundry and Databricks'."
readme = "README.md"
# PyRIT, used by the AI Red Teaming Agent, supports Python 3.10 to 3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-ai-evaluation[redteam]~=1.18.9",
  "azure-ai-projects~=2.9.0",
  "azure-identity~=1.26.0",
  "azure-mgmt-apimanagement~=5.0.0",
  "azure-monitor-opentelemetry~=1.8.11",
  "azure-monitor-query~=2.0.0",
  "openai~=3.35.1",
  "opentelemetry-sdk~=1.45.1",
  "requests~=2.34.2",
]

[project.optional-dependencies]
# Only needed for the optional Unity Gateway lab.
databricks = [
  "databricks-sdk~=0.154.0",
]

[dependency-groups]
dev = [
  "ruff~=0.17.1",
]

[build-system]
requires = ["hatchling~=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
